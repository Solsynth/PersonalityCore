providersDir = "./models.d"

# ─── HTTP ────────────────────────────────────────────────────────────
[http]
port = "8090"

# ─── gRPC ────────────────────────────────────────────────────────────
[grpc]
port = "9095"
useTLS = false
certFile = ""
keyFile = ""

# ─── Database ────────────────────────────────────────────────────────
[database]
dsn = "host=postgres port=5432 user=dyson password=dyson dbname=personality_core sslmode=disable"

# ─── Auth ────────────────────────────────────────────────────────────
[auth]
target = "stargate:9090"       # Stargate auth gRPC target (DyAuthService + DyPermissionService; took over Padlock's auth surface)
useTLS = true                  # Stargate serves the fleet self-signed cert
tlsSkipVerify = true
allowDevIds = true             # allow X-Account-Id header for dev
offline = false                # true = every request becomes offlineAccountId
offlineAccountId = "local-dev"
autonomousSecret = ""          # shared secret for X-Autonomous-Secret header

# ─── Billing (optional) ─────────────────────────────────────────────
# Usage is settled once per UTC day. Currency and all amounts use wallet golds.
[billing]
enabled = false
target = ""                    # Wallet gRPC target (host:port)
useTLS = false
tlsSkipVerify = false
payeeAccountId = ""            # optional; Wallet chooses its default/system payee when unset
currency = "golds"
serviceFeePercentage = "0"    # percentage added to every priced model call, e.g. "5" = 5%
# Amount limits per UTC hour/day; omitted currency = unlimited.
hourlyUsageLimits = { golds = "5", points = "100" }
dailyUsageLimits = { golds = "20", points = "500" }
instantBillingWall = "20"      # unpaid golds; 0 = only daily settlement

# ─── Solar Network ──────────────────────────────────────────────────

# ─── Sentry (optional) ─────────────────────────────────────────────
# [sentry]
# dsn = ""
# tracesSampleRate = 0.01
# environment = "production"
# release = "v1.0.0"

# ─── Providers ──────────────────────────────────────────────────────
# Providers define model backends. Each provider has an id and one or more models.
# Models can be split into separate .toml files under providersDir.

[[providers]]
id = "openai"
type = "openai"
apiKey = "sk-..."
baseUrl = "https://api.openai.com/v1"
timeout = "90s"
maxCompletionTokens = 2048    # default for all models under this provider
temperature = 0.7
topP = 1.0
# contextWindow is the model's input-token ceiling, used only to report how
# full a run's context was. Default for all models under this provider.
contextWindow = 128000
# discoverContextWindow asks this provider's /models endpoint for a ceiling when
# neither the model config nor a built-in preset supplies one. Off by default:
# it is an extra request on the first run that needs a window, and most hosted
# providers do not report one anyway.
discoverContextWindow = false

# Model-level config overrides provider defaults.
[[providers.models]]
name = "gpt-4o"
modalities = ["image"]        # this model supports image input
maxCompletionTokens = 4096
contextWindow = 128000        # overrides the provider default for this model
temperature = 0.7

# Per-model perk overrides: restrict or cap specific models per perk level.
[providers.models.perkOverrides.0]
blocked = true                # perk 0 users cannot use gpt-4o at all

[providers.models.perkOverrides.1]
maxCompletionTokens = 2048    # perk 1 users get capped output on gpt-4o

[[providers.models]]
name = "gpt-4.1-mini"
modalities = ["image"]
maxCompletionTokens = 4096

[providers.models.pricing]
currency = "golds"            # Wallet currency; e.g. "points"
input = "0.01"               # golds per 1M input tokens
output = "0.04"              # golds per 1M output tokens

[[providers.models]]
name = "text-embedding-3-small"
type = "embedding"            # embedding models are excluded from completion/chat paths

[providers.models.perkOverrides.0]
maxCompletionTokens = 1024    # perk 0 users get less output on mini too

[[providers]]
id = "anthropic"
type = "openai-compatible"
apiKey = "sk-ant-..."
baseUrl = "https://api.anthropic.com/v1"
timeout = "120s"
maxCompletionTokens = 4096
temperature = 1.0

[[providers.models]]
name = "claude-sonnet-4"
maxCompletionTokens = 8192

[[providers.models]]
name = "claude-opus-4"
maxCompletionTokens = 8192

[providers.models.perkOverrides.0]
blocked = true                # perk 0 can't use opus

[providers.models.perkOverrides.1]
blocked = true                # perk 1 can't use opus either

[providers.models.perkOverrides.2]
maxCompletionTokens = 4096    # perk 2 gets capped output on opus

# ─── Personality ────────────────────────────────────────────────────
[personality]
maxHistoryMessages = 24       # how many recent messages to include in context
sseHeartbeat = "15s"          # SSE heartbeat interval
chatInboundDebounce = "5s"   # debounce window for inbound solar messages
visionModel = "openai/gpt-4o" # model used to summarize images for non-vision models
defaultEmbeddingModel = "openai/text-embedding-3-small"
onlyAllowListedModels = false # true = reject provider/model references not declared below
dynamicSkills = true          # false = all ability-gated skill tools load eagerly into context; list_skills/activate_skill are omitted
imageInlineMaxBytes = 1048576 # pictures up to this size travel in the request as base64 (the file server's compressed variant); larger ones travel as a signed link

# ─── Surfing ────────────────────────────────────────────────────────
[personality.surfing]
enabled = false
interval = "1h"
prompt = "Browse the feed and interact with interesting posts. Reply, react, or repost as you see fit."

# ─── Perk Tiers ─────────────────────────────────────────────────────
# Each tier overrides defaults for that perk level (0-3).
# Unset fields = unrestricted. Only configure tiers that restrict something.
# Perk level comes from the authenticated Solarpass.

[personality.perkTiers.0]
maxHistoryMessages = 8        # basic users get 8 messages of context
maxCompletionTokens = 1024    # global fallback cap (overridden by per-model/per-agent)
allowVision = false           # no image analysis
allowFileSummary = false      # no file summarization
blockedSkills = ["surfing", "tasks"]  # can't browse feed or create tasks

[personality.perkTiers.1]
maxHistoryMessages = 16
blockedSkills = ["surfing"]   # can use tasks but not surf

# perk 2 and 3 are unrestricted (no config needed)

# ─── Web search ─────────────────────────────────────────────────────
# The server queries public search engines directly (no search API or
# aggregator), merges their results, and crawls what it finds into a local
# index so later queries can still be answered when engines block.
[webSearch]
enabled = false                # required by agents with the "web_search" ability
defaultLimit = 5
maxLimit = 10
timeout = "15s"                # per engine request
cacheTTL = "5m"                # 0 disables the response cache
language = "en"
# userAgent = ""               # defaults to a browser identity; engines block bots
# mode = "parallel"            # "prefer" walks engines in order and stops at the
                               # first that answers, so a paid API listed first is
                               # not billed on every query

# Defaults to duckduckgo's no-JavaScript endpoint when omitted. "bing" and
# "google" are supported but opt-in: Bing answers longer queries with results
# about unrelated topics, and Google serves a JavaScript interstitial to
# server-side clients unless the egress renders it.
[[webSearch.engines]]
type = "duckduckgo"

# API-backed engines for datacenter egresses that scraped engines block. List
# one first with mode = "prefer" above. `price` is what one query through that
# engine charges the caller, in [billing].currency (normally golds); scraped
# engines can be priced too, or left free by omitting price. All three of these
# engines are billed per request by their provider, so `price` is the whole cost
# of a query on them.
# [[webSearch.engines]]
# type = "exa"
# apiKey = "YOUR_EXA_KEY"
# price = "1.5"
# timeout = "20s"

# [[webSearch.engines]]
# type = "tavily"
# apiKey = "YOUR_TAVILY_KEY"
# price = "0.5"

# DeepSeek's own search engine, reached through its Search and Fetch APIs
# (POST /v1/tools/search, /v1/tools/fetch). Raw JSON, no model in the loop.
# The engine carries no credentials of its own: `provider` names a
# [[providers]] entry (inline or from providersDir) and the search runs on that
# account's apiKey and baseUrl, which must therefore exist — startup fails on a
# missing, unknown, or keyless provider. The provider's base URL is the chat
# API; the tool endpoints live beside it, so both
# https://api.deepseek.com and https://api.deepseek.com/v1 work, and an
# .../anthropic base left over from an older config is reduced to the same root.
# The search returns a display snippet, a model-readable summary, and the page
# content, so results are readable with no crawl and that text goes straight into
# the index. A page the search did not return content for is read through the
# provider's Fetch API instead of a request from this process. `domains`,
# `language` and `freshness` are sent as the provider's site:, lang: and after:
# query operators; the provider caps a query at 128 characters, so on a very long
# query a clause is dropped and the domain restriction is enforced on the hits
# rather than abandoned. DeepSeek bills both endpoints per successful request
# (USD 0.75 per 1,000), never by tokens. `price` is one flat amount in golds per
# query the engine answered — normally "0.1" — and covers every request that
# query made, the search plus a fetch per page read through the provider. It is
# not derived from tokens and not charged per request. Empty results are not
# billed.
# [[webSearch.engines]]
# type = "deepseek"
# provider = "deepseek"        # id of a [[providers]] entry
# price = "0.1"

# [[webSearch.engines]]
# type = "bing"
# region = "en-GB"             # ddg: kl, bing: mkt, google: gl
# timeout = "10s"
# enabled = false              # keep the engine configured but unused

[webSearch.crawl]
enabled = true                 # fetch top results into the local index
maxPagesPerQuery = 3
pageTimeout = "8s"
perHostDelay = "1s"            # robots.txt Crawl-delay wins when larger
maxPageBytes = 2097152

# ─── Agents ─────────────────────────────────────────────────────────
[agents]
dir = "./agents.d"

# Agent: a general-purpose assistant (REST API only)
[[agents.items]]
id = "support"
name = "Support"
description = "General support assistant"
systemPromptFile = "./prompts/support.md"
model = "openai/gpt-4.1-mini"
# temperature = 0.7          # override model default
# topP = 1.0
maxCompletionTokens = 4096
billingMultiplier = 1.0         # optional multiplier for this agent's priced model calls
# disableThinking = false
# Web search ability (requires [webSearch] enabled): "web_search"
enabled = true
enabled = true


# Per-agent perk overrides: cap output for lower perk levels.
[agents.items.perkOverrides.0]
maxCompletionTokens = 512     # basic users get short answers from support

[agents.items.perkOverrides.1]
maxCompletionTokens = 2048

# Companion agents combine the humanizer ability with durable memory and
# agent-owned notes so they stay emotionally and biographically consistent.
[[agents.items]]
id = "mochi"
name = "Mochi"
description = "A warm desktop companion"
systemPromptFile = "./prompts/mochi.md"
model = "openai/gpt-4.1-mini"
abilities = ["memory", "mood", "relationship"]
enabled = true

# Agent: an internal preset hidden from the catalog.
# `hidden = true` keeps the agent out of GET /api/agents and gRPC ListAgents,
# but clients that know the id can still create conversations and runs, and
# autonomous/surfing/Solar automation keeps running for it.
[[agents.items]]
id = "planner"
name = "Planner"
description = "Internal planning helper, not browsable"
systemPrompt = "You break tasks into steps."
model = "openai/gpt-4.1-mini"
abilities = []
enabled = true
hidden = true

# Agent: a chat bot connected to Solar Network
[[agents.items]]
id = "support-bot"
name = "Support Bot"
description = "Bot agent connected to Solar chat"
systemPrompt = "You are a support bot for Solar Network chat."
model = "openai/gpt-4.1-mini"
chatMaxCompletionTokens = 160  # cap for chat tool path specifically
abilities = ["chat", "autonomous"]
enabled = true

[agents.items.solar-network-integration]
accountName = "support-bot"
accessToken = ""
# publisherName = "Support Bot"  # override display name for post creation

[agents.items.autonomous]
wakeInterval = "10m"
wakePrompt = "Check whether any active or DM conversations need a proactive follow-up."

[agents.items.perkOverrides.0]
maxCompletionTokens = 100    # chat bot gets very short replies for basic users
